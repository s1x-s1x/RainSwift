name: tls-windows
# RainSwift in the hybrid TLS 1.3 stack (tls/): build the Windows DLLs from src/, run the
# known-answer gate on them, then the TLS test suite and the demo with Rain required.
on:
  push:
    paths: ["tls/**", "src/**", "KAT/**", "submission.json", ".github/workflows/tls-windows.yml"]
  pull_request:
    paths: ["tls/**", "src/**", "KAT/**", "submission.json", ".github/workflows/tls-windows.yml"]
  workflow_dispatch:
jobs:
  tls:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: MinGW-w64 GCC (MSYS2 UCRT64)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: XKCP at the revision pinned in src/subprojects/xkcp.wrap
        run: |
          $rev = (Select-String -Path src/subprojects/xkcp.wrap -Pattern '^revision = ([0-9a-f]{40})').Matches[0].Groups[1].Value
          git init -q xkcp
          git -C xkcp fetch -q --depth 1 https://github.com/XKCP/XKCP.git $rev
          git -C xkcp checkout -q FETCH_HEAD
          git -C xkcp rev-parse HEAD
      - name: Build rain_voleith_tls.dll and the test build
        working-directory: tls
        run: |
          $gcc = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "ucrt64\bin"
          & "$gcc\gcc.exe" --version | Select-Object -First 1
          python -I native/rain_voleith/build.py --gcc-bin $gcc --rain-src ../src --xkcp-src ../xkcp --out build/native-rain --jobs 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -I native/rain_voleith/build.py --gcc-bin $gcc --rain-src ../src --xkcp-src ../xkcp --out build/native-rain-test --test-hooks --jobs 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item build/native-rain/rain_voleith_tls.dll build/
      - name: Known-answer gate (KAT reproduction, key-generation KATs, negative cases)
        working-directory: tls
        run: python -I tools/rain_voleith_kat_gate.py --release build/rain_voleith_tls.dll --test build/native-rain-test/rain_voleith_tls_test.dll --kat-dir ../KAT --rain-src ../src
      - name: Locked dependencies (hash-pinned wheels)
        working-directory: tls
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary ":all:" --target .deps -r requirements.lock.txt -r reference/requirements.lock.txt
      - name: Test suite with RainSwift required
        working-directory: tls
        env:
          RAIN_VOLEITH_REQUIRED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $env:PYTHONPATH = Join-Path $PWD ".deps"
          python -m pytest tests -q -p no:cacheprovider
      - name: Demo (X.509 handshake, loopback TCP, tamper matrix)
        working-directory: tls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $env:PYTHONPATH = Join-Path $PWD ".deps"
          python demo/rain_voleith_demo.py

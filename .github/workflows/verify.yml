name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rain-voleith .
      - name: T1-T8 and signature KATs
        run: docker run --rm rain-voleith bash verify.sh
      - name: Usage example
        run: docker run --rm rain-voleith ./build/sign_demo
